<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f7f2ea"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect x="4" y="4" width="504" height="504" rx="96" fill="url(#bg)"/>

  <!-- 简笔画可爱猫咪：歪头圆耳，参考手账简笔画风格 -->
  <g fill="none" stroke="#2d2a30" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体（椭圆，坐姿） -->
    <path d="M170 380 C170 320 200 295 256 295 C312 295 342 320 342 380 C342 425 312 450 256 450 C200 450 170 425 170 380 Z"/>
    <!-- 头（略歪） -->
    <path d="M150 210 C150 150 195 120 256 120 C317 120 362 150 362 210 C362 270 317 300 256 300 C195 300 150 270 150 210 Z"/>
    <!-- 左耳（圆三角） -->
    <path d="M168 150 C158 110 165 95 175 95 C190 95 210 120 215 145"/>
    <!-- 右耳（圆三角） -->
    <path d="M344 150 C354 110 347 95 337 95 C322 95 302 120 297 145"/>
  </g>
  <!-- 耳朵内（粉色） -->
  <path d="M180 130 C178 115 184 108 190 110 C200 115 210 130 212 140 Z" fill="#ffd0d8" stroke="none"/>
  <path d="M332 130 C334 115 328 108 322 110 C312 115 302 130 300 140 Z" fill="#ffd0d8" stroke="none"/>

  <g fill="none" stroke="#2d2a30" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- 眼睛（两点） -->
    <circle cx="220" cy="215" r="6" fill="#2d2a30" stroke="none"/>
    <circle cx="292" cy="215" r="6" fill="#2d2a30" stroke="none"/>
    <!-- 腮红 -->
    <ellipse cx="190" cy="245" rx="16" ry="10" fill="#ffd0d8" stroke="none" opacity="0.8"/>
    <ellipse cx="322" cy="245" rx="16" ry="10" fill="#ffd0d8" stroke="none" opacity="0.8"/>
    <!-- 鼻子 -->
    <path d="M248 248 L256 258 L264 248 Z" fill="#ff9eab" stroke="#2d2a30" stroke-width="6"/>
    <!-- 嘴 -->
    <path d="M256 258 Q244 272 232 264"/>
    <path d="M256 258 Q268 272 280 264"/>
    <!-- 胡须 -->
    <line x1="195" y1="250" x2="160" y2="245"/>
    <line x1="195" y1="262" x2="158" y2="265"/>
    <line x1="317" y1="250" x2="352" y2="245"/>
    <line x1="317" y1="262" x2="354" y2="265"/>
    <!-- 前爪 -->
    <path d="M205 380 Q205 410 225 410 Q245 410 245 380"/>
    <path d="M267 380 Q267 410 287 410 Q307 410 307 380"/>
    <!-- 尾巴（绕到旁边） -->
    <path d="M340 390 Q400 390 400 340 Q400 315 380 315"/>
  </g>
</svg>
