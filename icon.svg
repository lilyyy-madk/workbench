<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f7f2ea"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bg)"/>

  <!-- 黑猫身体 -->
  <ellipse cx="256" cy="330" rx="95" ry="85" fill="#2d2a30"/>

  <!-- 黑猫头 -->
  <circle cx="256" cy="225" r="85" fill="#2d2a30"/>

  <!-- 左耳 -->
  <polygon points="185,170 160,100 215,155" fill="#2d2a30"/>
  <polygon points="185,160 170,120 205,150" fill="#ffaebc"/>
  <!-- 右耳 -->
  <polygon points="327,170 352,100 297,155" fill="#2d2a30"/>
  <polygon points="327,160 342,120 307,150" fill="#ffaebc"/>

  <!-- 闭眼 -->
  <path d="M220,220 Q235,210 250,220" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <path d="M262,220 Q277,210 292,220" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- 腮红 -->
  <circle cx="190" cy="250" r="14" fill="#ffaebc" opacity="0.8"/>
  <circle cx="322" cy="250" r="14" fill="#ffaebc" opacity="0.8"/>

  <!-- 鼻子 -->
  <polygon points="256,245 248,258 264,258" fill="#ff8292"/>

  <!-- 前爪（抱着牌子） -->
  <ellipse cx="205" cy="315" rx="22" ry="30" fill="#2d2a30" transform="rotate(-20 205 315)"/>
  <ellipse cx="307" cy="315" rx="22" ry="30" fill="#2d2a30" transform="rotate(20 307 315)"/>

  <!-- Lily 牌子背景 -->
  <rect x="175" y="290" width="162" height="80" rx="22" fill="white" opacity="0.95"/>
  <!-- 牌子描边 -->
  <rect x="175" y="290" width="162" height="80" rx="22" fill="none" stroke="#ffd8de" stroke-width="4"/>

  <!-- Lily 文字 -->
  <text x="256" y="350" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="60" fill="#ff82a2">Lily</text>
</svg>
