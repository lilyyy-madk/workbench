<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f7f2ea"/>
    </linearGradient>
  </defs>
  <!-- 背景几乎撑满 -->
  <rect x="4" y="4" width="504" height="504" rx="80" fill="url(#bg)"/>

  <!-- 黑猫身体放大 -->
  <ellipse cx="256" cy="380" rx="160" ry="130" fill="#2d2a30"/>

  <!-- 黑猫头放大 -->
  <circle cx="256" cy="220" r="145" fill="#2d2a30"/>

  <!-- 左耳 -->
  <polygon points="138,155 95,20 190,140" fill="#2d2a30"/>
  <polygon points="145,145 115,55 185,135" fill="#ffaebc"/>
  <!-- 右耳 -->
  <polygon points="374,155 417,20 322,140" fill="#2d2a30"/>
  <polygon points="367,145 397,55 327,135" fill="#ffaebc"/>

  <!-- 闭眼 -->
  <path d="M185,210 Q210,190 235,210" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <path d="M277,210 Q302,190 327,210" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- 腮红 -->
  <circle cx="150" cy="250" r="22" fill="#ffaebc" opacity="0.8"/>
  <circle cx="362" cy="250" r="22" fill="#ffaebc" opacity="0.8"/>

  <!-- 鼻子 -->
  <polygon points="256,245 240,268 272,268" fill="#ff8292"/>

  <!-- 前爪 -->
  <ellipse cx="175" cy="345" rx="42" ry="55" fill="#2d2a30" transform="rotate(-20 175 345)"/>
  <ellipse cx="337" cy="345" rx="42" ry="55" fill="#2d2a30" transform="rotate(20 337 345)"/>

  <!-- Lily 牌子放大 -->
  <rect x="118" y="305" width="276" height="120" rx="34" fill="white" opacity="0.96"/>
  <rect x="118" y="305" width="276" height="120" rx="34" fill="none" stroke="#ffd8de" stroke-width="6"/>

  <!-- Lily 文字放大 -->
  <text x="256" y="400" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="88" fill="#ff82a2">Lily</text>
</svg>
