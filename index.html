<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lily的工作台">
  <meta name="theme-color" content="#7dc67d">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Lily的工作台 🐱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 侧边导航栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🐱</span>
          <span class="logo-text">Lily的工作台</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="收起菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
      <nav class="nav-list" id="navList">
        <a class="nav-item active" data-page="todo" href="#todo">
          <span class="nav-icon">✅</span>
          <span class="nav-label">待办事项</span>
        </a>
        <a class="nav-item" data-page="water" href="#water">
          <span class="nav-icon">💧</span>
          <span class="nav-label">喝水提醒</span>
        </a>
        <a class="nav-item" data-page="diet" href="#diet">
          <span class="nav-icon">🍽️</span>
          <span class="nav-label">饮食记录</span>
        </a>
        <a class="nav-item" data-page="study" href="#study">
          <span class="nav-icon">📚</span>
          <span class="nav-label">每日学习</span>
        </a>
        <a class="nav-item" data-page="fitness" href="#fitness">
          <span class="nav-icon">🏃</span>
          <span class="nav-label">健身计划</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-item" data-page="settings" href="#settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">设置</span>
        </a>
        <div class="date-display" id="dateDisplay"></div>
      </div>
    </aside>

    <!-- 遮罩层（移动端） -->
    <div class="overlay" id="overlay"></div>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
      <!-- 移动端顶部栏 -->
      <header class="mobile-header">
        <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="mobile-title" id="mobileTitle">待办事项</span>
        <div style="width:24px"></div>
      </header>

      <!-- 页面容器 -->
      <div class="page-container" id="pageContainer">
        <!-- 待办事项 -->
        <section class="page page-todo active" id="page-todo"></section>
        <!-- 喝水提醒 -->
        <section class="page page-water" id="page-water"></section>
        <!-- 饮食记录 -->
        <section class="page page-diet" id="page-diet"></section>
        <!-- 每日学习 -->
        <section class="page page-study" id="page-study"></section>
        <!-- 健身计划 -->
        <section class="page page-fitness" id="page-fitness"></section>
        <!-- 设置 -->
        <section class="page page-settings" id="page-settings"></section>
      </div>
    </main>

    <!-- 移动端底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
      <a class="bottom-nav-item active" data-page="todo" href="#todo">
        ✅<span>待办</span>
      </a>
      <a class="bottom-nav-item" data-page="water" href="#water">
        💧<span>喝水</span>
      </a>
      <a class="bottom-nav-item" data-page="diet" href="#diet">
        🍽️<span>饮食</span>
      </a>
      <a class="bottom-nav-item" data-page="study" href="#study">
        📚<span>学习</span>
      </a>
      <a class="bottom-nav-item" data-page="fitness" href="#fitness">
        🏃<span>健身</span>
      </a>
    </nav>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>
  <!-- Modal 容器 -->
  <div class="modal-container" id="modalContainer"></div>

  <script src="utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
